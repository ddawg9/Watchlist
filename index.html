
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>
<body>

    <header>
        <h1>My Watchlist</h1>
        <p>Find TV shows and keep track of what you want to watch!</p>
    </header>

    <main>
        <section>
            <h2>Search TV Shows</h2>

            <form id="search-form">
                <label for="search">Show name:</label>
                <input type="text" id="search" placeholder="Search for a show">

                <button type="submit">Search</button>
            </form>
        </section>

        <section>
            <h2>Search Results</h2>
            <ul id="results"></ul>
        </section>

        <section>
            <h2>My Watchlist</h2>
            <ul id="watchlist"></ul>
        </section>
    </main>

    <footer>
        <p>My Watchlist - COSC 219 Final Project</p>
    </footer>

</body>
</html>
